name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` runs the postinstall `wxt prepare`, which generates the .wxt
      # types the type-check depends on, so it has to come first.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Test
        run: npm test
